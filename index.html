<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Sofija Sabljić – Sponzor</title>
<style>
    /* Reset */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body, html {
        height: 100%;
        font-family: 'Arial', sans-serif;
        scroll-behavior: smooth;
    }

    body {
        background-image: url('sofija alah.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: white;
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.3);
        z-index: 0;
    }

    nav {
        position: fixed;
        top: 0;
        width: 100%;
        background: rgba(0,0,0,0.5);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        z-index: 2;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        margin-left: 20px;
        transition: 0.3s;
    }

    nav a:hover {
        color: #ffcc00;
    }

    .content {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 100px 20px 50px 20px;
        max-width: 1200px;
        margin: 0 auto;
    }

    h1 {
        font-size: 70px;
        margin-bottom: 20px;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
    }

    p {
        font-size: 24px;
        margin-bottom: 50px;
        max-width: 900px;
        line-height: 1.5;
        margin-left: auto;
        margin-right: auto;
        text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
    }

    .media-container {
        display: flex;
        gap: 30px;
        justify-content: center;
        align-items: flex-start;
        flex-wrap: wrap;
        margin-bottom: 60px;
    }

    .media-container img,
    .media-container video {
        max-width: 100%;
        height: auto;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        transition: transform 0.3s, box-shadow 0.3s;
        cursor: pointer;
    }

    .media-container img:hover,
    .media-container video:hover {
        transform: scale(1.05);
        box-shadow: 0 12px 30px rgba(0,0,0,0.7);
    }

    .media-container img:active,
    .media-container video:active {
        transform: scale(0.95);
    }

    .bottom-title {
        font-size: 48px;
        margin-top: 40px;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
    }

    /* Kontakt sekcija s animacijom */
    .contact {
        margin-top: 50px;
        font-size: 36px;
        font-weight: bold;
        animation: pulse 2s infinite;
        transition: 0.3s;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
        cursor: pointer;
    }

    /* Hover efekt */
    .contact:hover {
        color: #ffcc00;
        text-shadow: 0 0 20px #ffcc00;
        transform: scale(1.1);
    }

    /* Animacija pulsiranja */
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }

    /* Responsivnost */
    @media (max-width: 900px) {
        h1 {
            font-size: 50px;
        }
        p {
            font-size: 20px;
        }
        .media-container {
            flex-direction: column;
            gap: 20px;
        }
        .bottom-title {
            font-size: 36px;
        }
        .contact {
            font-size: 28px;
        }
    }

</style>
</head>
<body>

<div class="overlay"></div>

<nav>
    <div class="logo">Sofija Sabljić</div>
    <div class="nav-links">
        <a href="#home">Početna</a>
        <a href="#media">Mediji</a>
        <a href="#contact">Kontakt</a>
    </div>
</nav>

<div class="content" id="home">
    <h1>Sofija Sabljić – Sponzor</h1>
    <p><b>Sofija Sabljić je izmišljena influencerica koja otvoreno promiče seksualno zdravlje i samopouzdanje.</b></p>

    <div class="media-container" id="media">
        <img src="sofija alah.png" alt="Sofija Sabljić">
        <video src="sofija tuff.mp4" controls></video>
    </div>

    <div class="bottom-title" id="contact">Leo Sabljić</div>

    <div class="contact">
        JEBO TE ALAH
    </div>
</div>

</body>
</html>
